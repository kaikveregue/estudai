<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EstudAI</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
    header{background:#1e293b;padding:12px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px}
    .logo{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
    h1{font-size:16px;font-weight:600}
    .status{font-size:11px;color:#94a3b8}
    .chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
    .user{align-self:flex-end;background:#2563eb;color:white;border-bottom-right-radius:4px}
    .bot{align-self:flex-start;background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
    .input-area{padding:12px;background:#1e293b;border-top:1px solid #334155;display:flex;gap:8px}
    textarea{flex:1;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:10px 14px;color:#e2e8f0;font-size:14px;resize:none;max-height:120px;font-family:inherit}
    textarea:focus{outline:none;border-color:#3b82f6}
    button{background:#2563eb;color:white;border:none;border-radius:12px;padding:0 16px;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5}
    .typing{display:flex;gap:4px;padding:4px}
    .dot{width:6px;height:6px;background:#60a5fa;border-radius:50%;animation:b 1.4s infinite}
    .dot:nth-child(2){animation-delay:.2s}
    .dot:nth-child(3){animation-delay:.4s}
    @keyframes b{0%,80%,100%{transform:scale(.8);opacity:.5}40%{transform:scale(1);opacity:1}}
    .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#64748b}
    .empty-icon{font-size:48px;margin-bottom:12px}
  </style>
</head>
<body>
  <header>
    <div class="logo">🎓</div>
    <div>
      <h1>EstudAI</h1>
      <div class="status" id="status">IA Gratuita • Chats salvos ✓</div>
    </div>
  </header>

  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="empty-icon">💬</div>
      <p><b>Assistente de estudos com IA</b></p>
      <p style="font-size:13px;margin-top:8px">Pergunte sobre qualquer matéria</p>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="Digite sua dúvida..." rows="1"></textarea>
    <button id="send">Enviar</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const status = document.getElementById('status');
    const empty = document.getElementById('empty');
    
    let messages = JSON.parse(localStorage.getItem('estudai_chat') || '[]');
    
    function save() {
      localStorage.setItem('estudai_chat', JSON.stringify(messages.slice(-100)));
    }
    
    function addMsg(text, isUser) {
      empty.style.display = 'none';
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'bot');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }
    
    // Carregar histórico
    messages.forEach(m => addMsg(m.text, m.role === 'user'));
    if (messages.length) empty.style.display = 'none';
    
    async function sendMsg() {
      const text = input.value.trim();
      if (!text || send.disabled) return;
      
      input.value = '';
      input.style.height = 'auto';
      addMsg(text, true);
      messages.push({role:'user', text, time:Date.now()});
      save();
      
      send.disabled = true;
      status.textContent = 'IA pensando...';
      
      const typing = document.createElement('div');
      typing.className = 'msg bot';
      typing.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;
      
      try {
        // Verifica se o Puter carregou
        if (typeof puter === 'undefined') {
          throw new Error('IA não carregou. Recarregue a página.');
        }
        
        const history = messages.slice(-8).map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{text: m.text}]
        }));
        
        const res = await puter.ai.chat([
          {role:'user', parts:[{text:'Você é o EstudAI, um tutor brasileiro amigável e didático. Responda em português, seja claro e use exemplos práticos.'}]},
          {role:'model', parts:[{text:'Olá! Sou o EstudAI, pronto para te ajudar nos estudos. O que você quer aprender hoje?'}]},
          ...history,
          {role:'user', parts:[{text}]}
        ], {model:'google/gemini-2.5-flash', stream:true});
        
        typing.remove();
        let fullText = '';
        const botDiv = addMsg('', false);
        
        for await (const part of res) {
          if (part?.text) {
            fullText += part.text;
            botDiv.textContent = fullText;
            chat.scrollTop = chat.scrollHeight;
          }
        }
        
        messages.push({role:'assistant', text:fullText, time:Date.now()});
        save();
        status.textContent = 'IA Gratuita • Chats salvos ✓';
        
      } catch (e) {
        typing.remove();
        console.error(e);
        const errorMsg = e.message.includes('Failed to fetch') 
          ? 'Erro de conexão. Verifique sua internet e tente novamente.'
          : 'Erro: ' + e.message;
        addMsg('❌ ' + errorMsg, false);
        status.textContent = 'Erro - tente novamente';
      }
      
      send.disabled = false;
      input.focus();
    }
    
    send.onclick = sendMsg;
    input.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    };
    input.oninput = () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    };
  </script>
</body>
</html>
