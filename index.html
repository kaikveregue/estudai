<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EstudAI - Teste</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
    header{background:#1e293b;padding:12px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px}
    .logo{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
    h1{font-size:16px;font-weight:600}
    .status{font-size:11px;color:#94a3b8}
    .chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
    .user{align-self:flex-end;background:#2563eb;color:white;border-bottom-right-radius:4px}
    .bot{align-self:flex-start;background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
    .input-area{padding:12px;background:#1e293b;border-top:1px solid #334155;display:flex;gap:8px}
    textarea{flex:1;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:10px 14px;color:#e2e8f0;font-size:14px;resize:none;max-height:120px;font-family:inherit}
    textarea:focus{outline:none;border-color:#3b82f6}
    button{background:#2563eb;color:white;border:none;border-radius:12px;padding:0 16px;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5}
    .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#64748b}
    .empty-icon{font-size:48px;margin-bottom:12px}
  </style>
</head>
<body>
  <header>
    <div class="logo">🎓</div>
    <div>
      <h1>EstudAI (Modo Teste)</h1>
      <div class="status" id="status">Salvando chats localmente ✓</div>
    </div>
  </header>

  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="empty-icon">💬</div>
      <p><b>Teste de salvamento</b></p>
      <p style="font-size:13px;margin-top:8px">Envie uma mensagem e recarregue a página</p>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="Digite algo para testar..." rows="1"></textarea>
    <button id="send">Enviar</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const empty = document.getElementById('empty');
    
    // CARREGA DO BANCO LOCAL
    let messages = JSON.parse(localStorage.getItem('estudai_teste') || '[]');
    
    function save() {
      localStorage.setItem('estudai_teste', JSON.stringify(messages));
      console.log('Salvo!', messages.length, 'mensagens');
    }
    
    function addMsg(text, isUser) {
      empty.style.display = 'none';
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'bot');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    
    // MOSTRA HISTÓRICO AO CARREGAR
    messages.forEach(m => addMsg(m.text, m.isUser));
    if (messages.length) {
      empty.style.display = 'none';
      addMsg(`✓ Histórico carregado! Você tem ${messages.length} mensagens salvas.`, false);
    }
    
    // RESPOSTAS INTELIGENTES (sem IA externa)
    function getResposta(pergunta) {
      const p = pergunta.toLowerCase();
      
      if (p.includes('oi') || p.includes('olá') || p.includes('ola')) {
        return 'Olá! 👋 Eu sou o EstudAI em modo teste. Estou salvando todas as nossas conversas no seu navegador. Tente recarregar a página que você vai ver que eu lembro de tudo!';
      }
      if (p.includes('matemática') || p.includes('matematica')) {
        return '📐 Matemática é fundamental! Posso te ajudar com:\n• Equações do 1º e 2º grau\n• Geometria\n• Trigonometria\n• Cálculo\n\nO que você está estudando?';
      }
      if (p.includes('história') || p.includes('historia')) {
        return '📚 História do Brasil ou Mundial?\n\nPosso te ajudar com:\n• Brasil Colônia, Império, República\n• Guerras Mundiais\n• Revolução Francesa\n• Era Vargas';
      }
      if (p.includes('teste') || p.includes('salvar')) {
        return `✅ TESTE FUNCIONANDO!\n\nVocê enviou: "${pergunta}"\n\nAgora recarregue a página (F5 ou puxe para baixo no celular) e veja se esta conversa ainda está aqui. Se estiver, o salvamento está perfeito!`;
      }
      
      return `Recebi sua mensagem: "${pergunta}"\n\nNo modo completo com IA, eu responderia com explicações detalhadas. Por enquanto estou em modo teste para garantir que o salvamento de chats funciona.\n\nTotal de mensagens salvas: ${messages.length + 1}`;
    }
    
    async function sendMsg() {
      const text = input.value.trim();
      if (!text) return;
      
      input.value = '';
      input.style.height = 'auto';
      
      // Adiciona mensagem do usuário
      addMsg(text, true);
      messages.push({text, isUser:true, time:Date.now()});
      save();
      
      send.disabled = true;
      
      // Simula digitação
      await new Promise(r => setTimeout(r, 800));
      
      // Resposta inteligente
      const resposta = getResposta(text);
      addMsg(resposta, false);
      messages.push({text:resposta, isUser:false, time:Date.now()});
      save();
      
      send.disabled = false;
      input.focus();
    }
    
    send.onclick = sendMsg;
    input.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    };
    input.oninput = () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    };
    
    input.focus();
  </script>
</body>
</html>
